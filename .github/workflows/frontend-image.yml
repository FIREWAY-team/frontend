name: frontend-image

on:
  push:
    branches: [ develop, main, 'feature/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/fireway-team/frontend:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://fireroad.shop
            NEXT_PUBLIC_USE_MOCK=true
            NEXT_PUBLIC_KAKAO_MAP_APP_KEY=${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: AWS 자격 증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::136022486319:role/fire-dispatch-gha-deploy
          aws-region: ap-northeast-2

      - name: SSM으로 서버에서 pull & 재기동
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-0a21fc6612d33c27a \
            --document-name AWS-RunShellScript \
            --comment "deploy frontend ${{ github.sha }}" \
            --parameters 'commands=["su - ubuntu -c /home/ubuntu/deploy/deploy-frontend.sh"]' \
            --query Command.CommandId --output text)
          echo "CommandId: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id i-0a21fc6612d33c27a || true

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id i-0a21fc6612d33c27a \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id i-0a21fc6612d33c27a \
            --query Status --output text)
          [ "$STATUS" = "Success" ] || exit 1
